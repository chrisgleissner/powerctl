[project]
name = "powerctl"
version = "0.1.0"
description = "CLI to discover, query and switch TP-Link Kasa/Tapo smart plugs, with a safe power-cycle command."
requires-python = ">=3.11"
# Two device libraries, one per adapter:
#   python-kasa  - Kasa IOT devices (KP115, HS110, HS300 ...). That protocol has
#                  been stable for years, so the library's slow release cadence
#                  does not matter here.
#   plugp100     - Tapo devices, including firmware that speaks TPAP (P110M and
#                  newer). TPAP is not in any python-kasa release; plugp100
#                  shipped it in 6.0.1, so the fast moving half of the estate
#                  depends on the library that actually releases.
dependencies = [
    "python-kasa>=0.10.2,<0.11",
    "plugp100>=6.0.1,<7",
]

[project.scripts]
powerctl = "powerctl.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required because the python-kasa dependency is a pinned git commit; see the
# comment on project.dependencies.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/powerctl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The suite must keep covering the safety logic, so the gate is part of the
# default run rather than something CI adds on top.
addopts = "--cov=powerctl --cov-report=term-missing --cov-report=xml --cov-fail-under=95"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.coverage.run]
source = ["powerctl"]
branch = true

[tool.coverage.report]
# Every line of powerctl's own logic is exercised by the mocked device tests.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
