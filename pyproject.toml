[project]
name = "powerctl"
version = "0.1.0"
description = "CLI to discover, query and switch TP-Link Kasa/Tapo smart plugs, with a safe power-cycle command."
requires-python = ">=3.11"
dependencies = ["python-kasa>=0.10,<0.11"]

[project.scripts]
powerctl = "powerctl.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powerctl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
