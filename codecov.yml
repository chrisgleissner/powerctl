# Coverage is a safety property in this project: the guards that stop a power
# cut are the code most in need of tests. The gate is enforced twice, by the
# pytest run (--cov-fail-under) and here, so a drop fails the build even if the
# local gate is changed.
coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 95%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 90%
        threshold: 0%

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

ignore:
  - "tests/**"
